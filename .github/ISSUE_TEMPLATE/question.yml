name: Question or help request
description: Ask how something works, or get help with your account.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        **This tracker is public.** Please do not post your password or other
        private details here.

  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS version (if relevant)
      placeholder: iPhone 14, iOS 18.2
    validations:
      required: false
